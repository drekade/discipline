<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финансы / ФОП · ЖИЗНЬ.exe</title>
<style>
  :root{--paper:#fbf1e3;--ink:#211b16;--card:#fff9ef;--sage:#dce6c7;--yellow:#f7df9c;--lilac:#e4d4ec}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 "Segoe UI",sans-serif}
  main{max-width:560px;margin:auto;padding:16px 14px 28px}
  h1,h2{font-family:Georgia,serif;line-height:1.08;margin:0}
  h1{font-size:clamp(29px,7vw,42px)}h2{font-size:22px}
  p{margin:6px 0}
  a{color:inherit}
  .back{display:inline-flex;align-items:center;min-height:35px;text-decoration:none;font-weight:700;margin-bottom:6px}
  .card{border:1.6px solid var(--ink);border-radius:16px;background:var(--card);padding:13px;margin:0 0 11px}
  .hero{background:var(--sage)}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sub,.status{font-size:13px;color:#5b4e40}
  .section-head>label{margin:0}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  label{display:block;margin:9px 0 0;font-weight:650;font-size:13px}
  input,select,button,.button{font:inherit;color:inherit}
  input,select{display:block;width:100%;min-width:0;min-height:40px;margin:3px 0 0;padding:7px 8px;border:1px solid #a69883;border-radius:8px;background:#fffdf6}
  button,.button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:7px 11px;min-height:38px;border:1.4px solid var(--ink);border-radius:9px;background:var(--card);font-size:13px;font-weight:700;text-decoration:none;text-align:center}
  button:disabled{opacity:.55;cursor:default}.primary{background:var(--yellow)}.lilac{background:var(--lilac)}
  .actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .figures{margin:9px 0 0}.figures div{display:flex;gap:8px;justify-content:space-between;padding:5px 0}.figures dt{font-size:13px}.figures dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}
  .grand{border-top:1px solid #929d80;margin-top:4px}.due{background:var(--lilac);padding:8px 9px;border-radius:9px;margin-top:8px}
  .receipt{border-top:1px solid #cbbfae;padding:9px 0;overflow-wrap:anywhere}.receipt .actions{margin-top:6px}
  summary{cursor:pointer;font-weight:700}details[open] summary{margin-bottom:7px}
  :focus-visible{outline:2px solid #704b82;outline-offset:2px}[hidden]{display:none!important}
  @media(max-width:350px){.row{gap:5px}main{padding-inline:10px} .card{padding:11px}}

  .money-forms{margin-top:12px}
  .money-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:9px 0 13px}
  .money-switch button[aria-pressed="true"]{background:var(--lilac)}
  .money-summary{margin-top:12px;padding:9px 10px;border-radius:10px;background:#f5eddd}
  .money-summary dd{font-size:13px}
  .money-summary dt small{display:block;font-size:11px;color:#5b4e40}
  #money-log{margin-top:10px}
  #money-entries .receipt:first-child{border-top:0}
  #money-usd-panel>p,#money-other-panel>p{margin:5px 0}
  #tax-caption{margin-top:9px}

  .month-trigger{gap:7px;background:var(--lilac);border-radius:20px;padding:6px 10px}
  .month-trigger svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .month-chevron{font-size:16px;line-height:1}
  .month-trigger[aria-expanded="true"] .month-chevron{transform:rotate(180deg)}
  .month-picker{margin-top:10px;padding:10px;background:#f6eddf;border:1.4px solid var(--ink);border-radius:14px}
  .month-year-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .month-year-row strong{font:700 22px Georgia,serif}
  .month-year-row button{min-width:34px;min-height:33px;padding:2px;font-size:21px;border-radius:50%;line-height:1}
  .month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .month-grid button{min-width:0;padding:5px 2px;border-color:#c8b8a3;min-height:36px}
  .month-grid button[aria-current="date"]{border-color:var(--ink)}
  .month-grid button[aria-pressed="true"]{border-color:var(--ink);background:var(--lilac)}
  .month-today{margin-top:8px;background:var(--sage);width:100%;min-height:34px}
</style>
</head>
<body>
<main>
<a class="back" href="life-os.html#home">← Главная</a>
<header class="card hero">
  <h1>Финансы / ФОП</h1>
  <p class="sub">Записи хранятся в этом браузере.</p>
  <p class="status" id="storage-status" role="status" hidden></p>
</header>
<section class="card" aria-labelledby="money-title">
  <div class="section-head">
    <h2 id="money-title">Мои деньги</h2>
    <button class="month-trigger" type="button" id="month-trigger" aria-expanded="false" aria-controls="month-picker">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>
      <span id="month-caption"></span><span class="month-chevron" aria-hidden="true">⌄</span>
    </button>
  </div>
  <input id="money-month" type="hidden">
  <div class="month-picker" id="month-picker" hidden>
    <div class="month-year-row">
      <button type="button" id="month-prev" aria-label="Предыдущий год">‹</button>
      <strong id="month-year" aria-live="polite"></strong>
      <button type="button" id="month-next" aria-label="Следующий год">›</button>
    </div>
    <div class="month-grid" id="month-grid" role="group" aria-label="Месяцы"></div>
    <button class="month-today" id="month-today" type="button">К текущему месяцу</button>
  </div>
  <dl class="figures money-summary" id="money-summary"></dl>
  <div class="money-forms">
    <nav class="money-switch" aria-label="Тип записи">
      <button type="button" data-money-mode="usd" aria-pressed="true">USD на ФОП</button>
      <button type="button" data-money-mode="uah" aria-pressed="false">Оплата в грн</button>
      <button type="button" data-money-mode="savings" aria-pressed="false">В подушку</button>
      <button type="button" data-money-mode="balance" aria-pressed="false">Сколько осталось</button>
    </nav>
    <div id="money-usd-panel">
    <p class="sub">Дата зачисления на валютный счёт ФОП из Приват24 Бизнес.</p>
    <form id="receipt-form">
    <div class="row">
      <label>Дата зачисления<input id="date" type="date" min="2026-01-01" required></label>
      <label>Сумма, USD<input id="usd" inputmode="decimal" required></label>
    </div>
    <div class="row">
      <label>Курс НБУ, грн за $1<input id="rate" inputmode="decimal" required></label>
      <label>Инвойс / плательщик<input id="ref" maxlength="120" placeholder="Необязательно"></label>
    </div>
    <p class="status" id="rate-status" role="status"></p>
    <div class="actions">
      <button class="primary" type="submit" id="save-receipt">Записать поступление</button>
      <button type="button" id="lookup">Обновить курс</button>
      <button type="button" id="cancel" hidden>Отменить правку</button>
    </div>
    <p class="status" id="form-status" role="status"></p>
    </form>
    </div>
    <div id="money-other-panel" hidden>
      <p class="sub" id="money-help"></p>
      <form id="money-form">
        <div class="row">
          <label>Дата<input id="money-date" type="date" required></label>
          <label id="money-currency-label">Валюта
            <select id="money-currency"><option value="uah">Гривны</option><option value="usd">Доллары</option><option value="eur">Евро</option></select>
          </label>
          <label id="money-single-label"><span id="money-amount-label">Сумма, грн</span><input id="money-amount" inputmode="decimal"></label>
          <label id="money-uah-label" hidden>Осталось, грн<input id="money-uah" inputmode="decimal"></label>
          <label id="money-usd-label" hidden>Осталось, USD<input id="money-usd" inputmode="decimal"></label>
        </div>
        <label>Заметка<input id="money-note" maxlength="120" placeholder="Необязательно"></label>
        <div class="actions">
          <button class="primary" type="submit" id="money-save">Сохранить</button>
          <button type="button" id="money-cancel" hidden>Отменить правку</button>
        </div>
        <p class="status" id="money-status" role="status"></p>
      </form>
    </div>
  </div>
  <details id="money-log">
    <summary>Записи за месяц</summary>
    <div id="money-entries"></div>
  </details>
</section>
<section class="card hero" aria-labelledby="quarter-title">
  <div class="section-head"><h2 id="quarter-title">Расчёт за квартал</h2>
    <label>Период
      <select id="quarter">
        <option value="1">I квартал · янв–мар</option><option value="2">II квартал · апр–июн</option>
        <option value="3">III квартал · июл–сен</option><option value="4">IV квартал · окт–дек</option>
      </select>
    </label>
  </div>
  <p id="tax-caption" class="sub">ФОП · 2026 · 3-я группа · 5% без НДС</p>
  <dl class="figures" id="taxes"></dl>
  <details>
    <summary>Уже уплачено</summary>
    <form id="paid-form">
      <div class="row">
        <label>Единый налог, грн<input id="paid-unified" inputmode="decimal"></label>
        <label>Военный сбор, грн<input id="paid-military" inputmode="decimal"></label>
        <label>ЕСВ, грн<input id="paid-esv" inputmode="decimal"></label>
        <label>Месяцев ЕСВ
          <select id="months"><option>3</option><option>2</option><option>1</option><option>0</option></select>
        </label>
      </div>
      <div class="actions"><button class="lilac" type="submit">Сохранить суммы</button></div>
      <p class="status" id="paid-status" role="status"></p>
    </form>
  </details>
</section>
<section class="card">
  <h2>Поступления за квартал</h2>
  <p class="sub" id="receipt-count"></p>
  <div id="entries"></div>
</section>
<p class="sub">Расчёт по внесённым данным. <a href="https://kyivobl.tax.gov.ua/media-ark/news-ark/965745.html" target="_blank" rel="noopener">Ставки ДПС</a> · <a href="https://bank.gov.ua/ua/markets/exchangerates" target="_blank" rel="noopener">Курсы НБУ</a></p>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const key = 'life-os-fop-2026-v1';
  const format = new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
  const amount = cents => format.format(cents/100);
  const uah = cents => amount(cents)+' грн';
  const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv'}).format(new Date());
  const maxDate = today < '2026-12-31' ? today : '2026-12-31';
  const quarterOf = date => Math.ceil(Number(date.slice(5,7))/3);
  const emptyPaid = () => ({unified:0,military:0,esv:0,months:3});
  const validDate = date => /^2026-\d{2}-\d{2}$/.test(date) && date <= maxDate && Number.isFinite(Date.parse(date)) &&
    new Date(date).toISOString().slice(0,10) === date;
  const decimal = (value, places) => {
    const normalized = value.trim().replace(',','.');
    if(!new RegExp('^\\d+(?:\\.\\d{1,'+places+'})?$').test(normalized))return null;
    const [whole,part=''] = normalized.split('.');
    const scaled = Number(whole)*10**places+Number(part.padEnd(places,'0'));
    return Number.isSafeInteger(scaled)&&scaled<=100000000 ? scaled : null;
  };
  const toUah = (usd,rate) => Math.round(usd*rate/10000);
  const rateText = rate => (rate/10000).toFixed(4).replace('.',',');
  const dateText = date => date.split('-').reverse().join('.');
  const esvPerMonth = 190234;
  let state = { receipts:[], paid:{}, money:[] };
  let available = true, editId = null, rateSource = 'manual', request = 0;

  try {
    const stored = localStorage.getItem(key);
    if(stored)state = JSON.parse(stored);
    if(!Array.isArray(state.receipts)||!state.paid)throw new Error('invalid state');
    if(!Array.isArray(state.money))state.money=[];
  } catch {
    available=false;
    state={receipts:[],paid:{},money:[]};
    $('storage-status').hidden=false;
    $('storage-status').textContent='Хранилище браузера недоступно. Для сохранения записей открой файл в обычном браузере.';
  }

  function persist(next){
    if(!available)return false;
    try { localStorage.setItem(key,JSON.stringify(next)); }
    catch { return false; }
    state=next;
    return true;
  }

  function currentPaid(){
    return state.paid[$('quarter').value]||emptyPaid();
  }

  function loadPayments(){
    const paid=currentPaid();
    for(const field of ['unified','military','esv'])$('paid-'+field).value=paid[field]?(paid[field]/100).toFixed(2):'';
    $('months').value=String(paid.months);
    $('paid-status').textContent='';
  }

  function render(){
    renderMoney();
    const q=Number($('quarter').value);
    const rows=state.receipts.filter(entry=>quarterOf(entry.date)===q).sort((a,b)=>b.date.localeCompare(a.date));
    const income=rows.reduce((total,entry)=>total+entry.uah,0);
    const prior=state.receipts.filter(entry=>quarterOf(entry.date)<q).reduce((total,entry)=>total+entry.uah,0);
    const paid=currentPaid();
    const obligations={
      unified: Math.round((prior+income)*5/100)-Math.round(prior*5/100),
      military: Math.round((prior+income)/100)-Math.round(prior/100),
      esv: esvPerMonth*paid.months
    };
    const charges=obligations.unified+obligations.military+obligations.esv;
    const remaining=Object.keys(obligations).reduce((sum,k)=>sum+Math.max(0,obligations[k]-paid[k]),0);
    const lines=[
      ['Доход в гривнах',uah(income)],
      ['Единый налог · 5%',uah(obligations.unified)],
      ['Военный сбор · 1%',uah(obligations.military)],
      ['ЕСВ · месяцев: '+paid.months,uah(obligations.esv)],
      ['Начислено',uah(charges),'grand'],
      ['Остаток к уплате',uah(remaining),'due']
    ];
    $('taxes').replaceChildren(...lines.map(([label,value,cls])=>{
      const row=document.createElement('div'); row.className=cls||'';
      const dt=document.createElement('dt'),dd=document.createElement('dd');
      dt.textContent=label;dd.textContent=value;row.append(dt,dd);return row;
    }));
    $('receipt-count').textContent=rows.length ? 'USD '+amount(rows.reduce((sum,row)=>sum+row.usd,0))+' · '+uah(income) : 'Пока нет записей';
    $('entries').replaceChildren(...rows.map(entry=>{
      const row=document.createElement('article');row.className='receipt';
      const title=document.createElement('strong');
      title.textContent=dateText(entry.date)+' · $'+amount(entry.usd);
      const line=document.createElement('p');line.className='sub';
      line.textContent='Курс '+rateText(entry.rate)+' · '+uah(entry.uah)+(entry.source==='manual'?' · курс введён вручную':' · НБУ');
      row.append(title,line);
      if(entry.ref){const ref=document.createElement('p');ref.textContent=entry.ref;row.append(ref);}
      const actions=document.createElement('div');actions.className='actions';
      const edit=document.createElement('button');edit.type='button';edit.textContent='Изменить';
      edit.onclick=()=>{
        selectMoneyMode('usd');
        request++; $('lookup').disabled=false; editId=entry.id; rateSource=entry.source;
        $('date').value=entry.date;$('usd').value=(entry.usd/100).toFixed(2);
        $('rate').value=rateText(entry.rate);$('ref').value=entry.ref;
        $('rate-status').textContent=entry.source==='manual'?'Курс введён вручную.':'Курс НБУ сохранён с поступлением.';
        $('save-receipt').textContent='Сохранить изменения';$('cancel').hidden=false;$('form-status').textContent='';
        $('date').focus();
      };
      const del=document.createElement('button');del.type='button';del.textContent='Удалить';
      del.onclick=()=>{
        if(!confirm('Удалить это поступление из журнала?'))return;
        if(persist({...state,receipts:state.receipts.filter(row=>row.id!==entry.id)})){
          if(editId===entry.id)clearEdit();
          render();
        }else $('form-status').textContent='Не удалось сохранить изменение в браузере.';
      };
      actions.append(edit,del);row.append(actions);return row;
    }));
  }

  async function lookup(){
    const date=$('date').value;
    const id=++request;
    $('rate').value='';
    rateSource='manual';
    $('lookup').disabled=false;
    if(!validDate(date)){
      $('rate-status').textContent='Укажи дату зачисления в 2026 году.';
      return;
    }
    $('lookup').disabled=true;
    $('rate-status').textContent='Загружаю курс НБУ…';
    try{
      const url='https://bank.gov.ua/NBUStatService/v1/statdirectory/exchangenew?json&valcode=USD&date='+date.replaceAll('-','');
      const response=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(!response.ok)throw new Error('rate request');
      const rows=await response.json();
      const quote=rows.find(item=>item.cc==='USD'&&item.exchangedate===dateText(date));
      const rate=quote&&decimal(String(quote.rate),4);
      if(!rate)throw new Error('rate not found');
      if(id!==request)return;
      $('rate').value=rateText(rate);
      rateSource='nbu';
      $('rate-status').textContent='Официальный курс НБУ на '+dateText(date)+'.';
    }catch{
      if(id===request)$('rate-status').textContent='НБУ не ответил. Можно ввести официальный курс вручную.';
    }finally{
      if(id===request)$('lookup').disabled=false;
    }
  }

  function clearEdit(){
    editId=null;
    $('cancel').hidden=true;
    $('usd').value='';$('ref').value='';
    $('save-receipt').textContent='Записать поступление';
  }

  $('date').max=maxDate;
  $('date').value=maxDate>='2026-01-01'?maxDate:'';
  $('quarter').value=String($('date').value?quarterOf($('date').value):1);
  $('date').addEventListener('change',lookup);
  $('lookup').addEventListener('click',lookup);
  $('rate').addEventListener('input',()=>{
    request++;$('lookup').disabled=false;rateSource='manual';
    $('rate-status').textContent='Курс введён вручную.';
  });
  $('cancel').addEventListener('click',()=>{clearEdit();$('form-status').textContent='';});
  $('quarter').addEventListener('change',()=>{loadPayments();render();});
  $('receipt-form').addEventListener('submit',event=>{
    event.preventDefault();
    const date=$('date').value,usd=decimal($('usd').value,2),rate=decimal($('rate').value,4);
    if(!validDate(date)||!usd||!rate){
      $('form-status').textContent='Проверь дату, сумму в USD и курс НБУ.';
      return;
    }
    const entry={id:editId||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),date,usd,rate,source:rateSource,uah:toUah(usd,rate),ref:$('ref').value.trim()};
    const receipts=editId?state.receipts.map(row=>row.id===editId?entry:row):[...state.receipts,entry];
    if(!persist({...state,receipts})){
      $('form-status').textContent='Запись не сохранена. Проверь доступ к хранилищу браузера.';
      return;
    }
    $('quarter').value=String(quarterOf(date));
    $('money-month').value=date.slice(0,7);
    loadPayments();render();clearEdit();
    $('form-status').textContent='Поступление сохранено.';
  });
  $('paid-form').addEventListener('submit',event=>{
    event.preventDefault();
    const paid={months:Number($('months').value)};
    for(const field of ['unified','military','esv']){
      const input=$('paid-'+field).value.trim();
      paid[field]=input?decimal(input,2):0;
      if(paid[field]===null){$('paid-status').textContent='Проверь суммы в гривнах.';return;}
    }
    if(!persist({...state,paid:{...state.paid,[$('quarter').value]:paid}})){
      $('paid-status').textContent='Суммы не сохранены. Проверь доступ к хранилищу браузера.';
      return;
    }
    render();$('paid-status').textContent='Суммы сохранены.';
  });
  const modes = {
    uah: ['Записать оплату', 'Оплата в гривнах', 'Полученная оплата в гривнах. Учитывается в личном журнале.'],
    savings: ['Пополнить подушку', 'В подушку', 'Сумма, которую отложила. Каждая валюта считается отдельно.'],
    balance: ['Записать остаток', 'Остаток', 'Сколько денег осталось на эту дату. Можно заполнить одну валюту или обе.']
  };
  let moneyMode='usd', moneyEdit=null;

  function selectMoneyMode(mode){
    moneyMode=mode;
    $('money-usd-panel').hidden=mode!=='usd';
    $('money-other-panel').hidden=mode==='usd';
    document.querySelectorAll('[data-money-mode]').forEach(button=>{
      button.setAttribute('aria-pressed',String(button.dataset.moneyMode===mode));
    });
    if(mode==='usd')return;
    $('money-currency-label').hidden=mode!=='savings';
    $('money-single-label').hidden=mode==='balance';
    $('money-uah-label').hidden=mode!=='balance';
    $('money-usd-label').hidden=mode!=='balance';
    const currency=mode==='savings'?$('money-currency').value:'uah';
    $('money-amount-label').textContent='Сумма, '+currencyLabels[currency];
    $('money-save').textContent=moneyEdit?'Сохранить изменения':modes[mode][0];
    $('money-help').textContent=modes[mode][2];
  }

  function resetMoneyForm(){
    moneyEdit=null;
    $('money-form').reset();
    $('money-date').value=today;
    $('money-cancel').hidden=true;
    $('money-status').textContent='';
    selectMoneyMode(moneyMode);
  }

  function editMoney(entry){
    moneyEdit=entry.id;
    $('money-currency').value=entry.currency||'uah';
    selectMoneyMode(entry.type);
    $('money-date').value=entry.date;
    $('money-note').value=entry.note||'';
    $('money-amount').value=entry.amount==null?'':(entry.amount/100).toFixed(2);
    $('money-uah').value=entry.uah==null?'':(entry.uah/100).toFixed(2);
    $('money-usd').value=entry.usd==null?'':(entry.usd/100).toFixed(2);
    $('money-cancel').hidden=false;
    $('money-status').textContent='';
    $('money-date').focus();
  }

  const dollars = cents => '$'+amount(cents);
  const euros = cents => '€'+amount(cents);
  const currencyLabels = {uah:'грн',usd:'USD',eur:'EUR'};
  const currencyFormatters = {uah,usd:dollars,eur:euros};
  const savingsText = totals => [uah(totals.uah),dollars(totals.usd),euros(totals.eur)].join(' · ');
  function balanceText(row){
    const parts=[];
    if(row.uah!=null)parts.push(uah(row.uah));
    if(row.usd!=null)parts.push(dollars(row.usd));
    return parts.join(' · ');
  }

  function renderMoney(){
    const month=$('money-month').value;
    renderMonthCaption(month);
    const usdRows=state.receipts.filter(row=>row.date.slice(0,7)===month);
    const rows=state.money.filter(row=>row.date.slice(0,7)===month)
      .sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
    const receivedUsd=usdRows.reduce((sum,row)=>sum+row.usd,0);
    const receivedUah=rows.filter(row=>row.type==='uah').reduce((sum,row)=>sum+row.amount,0);
    const savings=state.money.filter(row=>row.type==='savings');
    const savingsTotal=items=>items.reduce((sum,row)=>{
      sum[row.currency]+=row.amount;return sum;
    },{uah:0,usd:0,eur:0});
    const cushion=savingsTotal(savings);
    const savedThisMonth=savingsTotal(savings.filter(row=>row.date.slice(0,7)===month));
    const latest=rows.find(row=>row.type==='balance');
    const lines=[
      ['Поступило на ФОП',dollars(receivedUsd)],
      ['Оплата в гривнах',uah(receivedUah)],
      ['Отложено за месяц',savingsText(savedThisMonth)],
      ['Подушка · всего',savingsText(cushion)],
      ['Остаток',latest?balanceText(latest):'Нет записи',latest?dateText(latest.date):'']
    ];
    $('money-summary').replaceChildren(...lines.map(([name,value,sub])=>{
      const line=document.createElement('div');
      const label=document.createElement('dt');
      const number=document.createElement('dd');
      label.textContent=name;
      if(sub){const small=document.createElement('small');small.textContent=sub;label.append(small);}
      number.textContent=value;line.append(label,number);return line;
    }));

    const combined=[...rows,...usdRows.map(row=>({...row,type:'usd'}))]
      .sort((a,b)=>b.date.localeCompare(a.date));
    if(!combined.length){
      $('money-entries').textContent='Пока нет записей';
      return;
    }
    $('money-entries').replaceChildren(...combined.map(entry=>{
      const row=document.createElement('article');row.className='receipt';
      const name=document.createElement('strong');
      const value=entry.type==='usd'?dollars(entry.usd):
        entry.type==='balance'?balanceText(entry):currencyFormatters[entry.currency](entry.amount);
      name.textContent=(entry.type==='usd'?'USD на ФОП':modes[entry.type][1])+' · '+value;
      const detail=document.createElement('p');detail.className='sub';
      const comment=entry.type==='usd'?entry.ref:entry.note;
      detail.textContent=dateText(entry.date)+(comment?' · '+comment:'');
      row.append(name,detail);
      if(entry.type==='usd')return row;
      const actions=document.createElement('div');actions.className='actions';
      const edit=document.createElement('button');edit.type='button';edit.textContent='Изменить';
      edit.onclick=()=>editMoney(entry);
      const remove=document.createElement('button');remove.type='button';remove.textContent='Удалить';
      remove.onclick=()=>{
        if(!confirm('Удалить эту запись?'))return;
        if(!persist({...state,money:state.money.filter(row=>row.id!==entry.id)})){
          $('money-status').textContent='Не удалось сохранить изменение в браузере.';
          return;
        }
        if(moneyEdit===entry.id)resetMoneyForm();
        renderMoney();
      };
      actions.append(edit,remove);row.append(actions);return row;
    }));
  }

  const currentMonth=today.slice(0,7);
  const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const monthShort=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  let pickerYear=Number(currentMonth.slice(0,4));

  function renderMonthCaption(value){
    const [year,month]=value.split('-');
    const caption=monthNames[Number(month)-1]+' '+year;
    $('month-caption').textContent=caption;
    $('month-trigger').setAttribute('aria-label','Выбрать месяц: '+caption);
  }

  function renderMonthPicker(){
    const selected=$('money-month').value;
    $('month-year').textContent=String(pickerYear);
    $('month-prev').disabled=pickerYear<=1;
    $('month-next').disabled=pickerYear>=9999;
    $('month-grid').replaceChildren(...monthNames.map((name,index)=>{
      const value=String(pickerYear).padStart(4,'0')+'-'+String(index+1).padStart(2,'0');
      const button=document.createElement('button');
      button.type='button';
      button.textContent=monthShort[index];
      button.setAttribute('aria-label',name+' '+pickerYear);
      button.setAttribute('aria-pressed',String(value===selected));
      if(value===currentMonth)button.setAttribute('aria-current','date');
      button.onclick=()=>chooseMoneyMonth(value);
      return button;
    }));
  }

  function toggleMonthPicker(open){
    $('month-picker').hidden=!open;
    $('month-trigger').setAttribute('aria-expanded',String(open));
    if(open){
      pickerYear=Number($('money-month').value.slice(0,4));
      renderMonthPicker();
      $('month-grid').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true});
    }
  }

  function chooseMoneyMonth(value){
    $('money-month').value=value;
    toggleMonthPicker(false);
    renderMoney();
    $('month-trigger').focus({preventScroll:true});
  }

  $('money-month').value=currentMonth;
  $('month-trigger').addEventListener('click',()=>toggleMonthPicker($('month-picker').hidden));
  $('month-prev').addEventListener('click',()=>{pickerYear--;renderMonthPicker();});
  $('month-next').addEventListener('click',()=>{pickerYear++;renderMonthPicker();});
  $('month-today').addEventListener('click',()=>chooseMoneyMonth(currentMonth));
  $('month-picker').addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      toggleMonthPicker(false);
      $('month-trigger').focus({preventScroll:true});
    }
  });
  $('money-date').max=today;
  $('money-date').value=today;
  $('money-currency').addEventListener('change',()=>selectMoneyMode(moneyMode));
  $('money-cancel').addEventListener('click',resetMoneyForm);
  document.querySelectorAll('[data-money-mode]').forEach(button=>{
    button.addEventListener('click',()=>{
      if(moneyMode===button.dataset.moneyMode)return;
      moneyMode=button.dataset.moneyMode;
      resetMoneyForm();
    });
  });
  $('money-form').addEventListener('submit',event=>{
    event.preventDefault();
    const date=$('money-date').value;
    if(!date||date>today){$('money-status').textContent='Проверь дату записи.';return;}
    const old=state.money.find(row=>row.id===moneyEdit);
    const entry={id:old?.id||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),
      created:old?.created||Date.now(),type:moneyMode,date,note:$('money-note').value.trim()};
    if(moneyMode==='balance'){
      const u=$('money-uah').value.trim(), v=$('money-usd').value.trim();
      entry.uah=u?decimal(u,2):null;entry.usd=v?decimal(v,2):null;
      if((u&&entry.uah===null)||(v&&entry.usd===null)||(!u&&!v)){
        $('money-status').textContent='Введи остаток хотя бы в одной валюте.';return;
      }
    }else{
      entry.currency=moneyMode==='uah'?'uah':$('money-currency').value;
      entry.amount=decimal($('money-amount').value,2);
      if(!entry.amount){$('money-status').textContent='Введи сумму больше нуля.';return;}
    }
    const money=old?state.money.map(row=>row.id===old.id?entry:row):[...state.money,entry];
    if(!persist({...state,money})){
      $('money-status').textContent='Запись не сохранена. Проверь доступ к хранилищу браузера.';return;
    }
    $('money-month').value=date.slice(0,7);
    resetMoneyForm();renderMoney();
    $('money-status').textContent='Запись сохранена.';
  });
  loadPayments();render();if($('date').value)lookup();
})();
</script>
</body>
</html>
