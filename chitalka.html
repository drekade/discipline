<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Читалка 🐾</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Читалка">
<meta name="theme-color" content="#F2EBDB">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EBDB; --card:#FFFDF8; --ink:#2B2238; --lilac:#5D3A8E;
  --orange:#FE702D; --muted:#8a7f6a; --line:#C9BFAA;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh; background:var(--bg);
  font-family:'Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:14px 12px 22px; user-select:none; overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}

.topbar{width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.langs{display:flex; gap:6px;}
.pill{border:3px solid var(--lilac); background:transparent; color:var(--lilac);
  border-radius:999px; padding:7px 14px; font-weight:800; font-size:13px;}
.pill.on{background:var(--lilac); color:var(--bg); box-shadow:3px 3px 0 var(--ink);}
.right{display:flex; align-items:center; gap:10px;}
.counter{display:flex; align-items:baseline; gap:5px;}
.counter b{font-size:26px; font-weight:900; color:var(--lilac);}
.counter span{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.05em;}
.eye{border:3px solid var(--line); background:var(--card); border-radius:12px; padding:6px 10px; font-size:16px;}

.modes{display:flex; gap:6px; margin-top:14px; max-width:560px; width:100%;
  justify-content:center; flex-wrap:wrap;}
.mode{border:3px solid var(--line); background:var(--card); color:#6b6151;
  border-radius:14px; padding:9px 15px; font-weight:800; font-size:14px; white-space:nowrap;}
.mode.on{border-color:var(--orange); background:var(--orange); color:#fff; box-shadow:4px 4px 0 var(--lilac);}

.subbar{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; justify-content:center; max-width:560px; min-height:34px;}
.chip{border:2px solid var(--line); background:transparent; color:var(--muted);
  border-radius:999px; padding:6px 12px; font-weight:800; font-size:12px;}
.chip.on{border-color:var(--lilac); background:var(--lilac); color:var(--bg);}

.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%; max-width:560px; position:relative; padding-top:8px; min-height:340px;}
.card{background:var(--card); border:4px solid var(--lilac); border-radius:26px;
  box-shadow:8px 8px 0 var(--lilac); padding:40px 32px; min-width:240px; max-width:94vw;
  text-align:center; transition:transform .12s ease;}
.card:active{transform:scale(.97);}
.word{font-weight:900; letter-spacing:.06em; line-height:1; white-space:nowrap;}
.sz-big{font-size:clamp(68px,17vw,120px);}
.sz-mid{font-size:clamp(54px,13vw,96px);}
.sz-small{font-size:clamp(42px,10vw,76px);}
.v{color:var(--orange);} .c{color:var(--ink);} .s{color:var(--lilac);}

.appear{animation:cardIn .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardIn{from{transform:scale(.6) rotate(-3deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.pop{animation:cardPop .3s ease forwards;}
@keyframes cardPop{to{transform:scale(1.16) rotate(3deg);opacity:0;}}

.praise{position:absolute; top:4%; font-size:28px; font-weight:900; color:var(--orange);
  pointer-events:none; animation:praiseUp .7s ease forwards;}
@keyframes praiseUp{from{transform:translateY(12px) scale(.7);opacity:0;}
  30%{transform:translateY(0) scale(1.1);opacity:1;}
  to{transform:translateY(-10px) scale(1);opacity:0;}}
.milestone{position:absolute; bottom:2%; background:var(--lilac); color:var(--bg);
  border-radius:16px; padding:11px 20px; font-size:17px; font-weight:800;
  box-shadow:5px 5px 0 var(--ink); pointer-events:none; animation:mileIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes mileIn{from{transform:translateY(18px) scale(.8);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

.hint{margin-top:20px; font-size:14px; font-weight:700; color:var(--muted); text-align:center;}

.famRow{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; justify-content:center;}
.famItem{font-size:17px; font-weight:800; color:var(--muted); border:2px solid transparent;
  border-radius:10px; padding:3px 9px; background:rgba(255,255,255,.5);}
.famItem.cur{color:var(--lilac); border-color:var(--lilac); background:var(--card);}
.famItem.done{color:var(--orange); opacity:.75;}

.paws{display:flex; gap:5px; margin-top:14px; font-size:22px;}
.paw{opacity:.18; transition:opacity .3s;}
.paw.on{opacity:1; animation:pawPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes pawPop{from{transform:scale(0);}60%{transform:scale(1.4);}to{transform:scale(1);}}

.overlay{position:fixed; inset:0; background:rgba(43,34,56,.45); display:none;
  align-items:center; justify-content:center; padding:16px; z-index:50;}
.overlay.show{display:flex;}
.panel{background:var(--card); border:4px solid var(--lilac); border-radius:22px;
  box-shadow:8px 8px 0 var(--lilac); padding:24px; max-width:440px; width:100%;
  max-height:86vh; overflow-y:auto;}
.panel h2{margin:0 0 14px; font-size:19px; color:var(--lilac);}
.stat{display:flex; justify-content:space-between; padding:7px 0; border-bottom:2px dashed var(--line);
  font-size:14px; font-weight:700; color:var(--ink);}
.stat b{color:var(--lilac);}
.wordTable{font-size:13px; font-weight:700; color:var(--ink); margin-top:10px; line-height:1.7;}
.wordTable .lbl{color:var(--lilac); font-size:13px; margin-top:10px;}
.wordTable .slow{color:var(--orange);}
.panelBtns{display:flex; gap:10px; margin-top:18px;}
.pbtn{flex:1; border:3px solid var(--lilac); background:var(--card); color:var(--lilac);
  border-radius:14px; padding:10px; font-weight:800; font-size:14px;}
.pbtn.danger{border-color:#C0392B; color:#C0392B;}

@media (prefers-reduced-motion: reduce){
  .appear,.pop,.praise,.milestone,.paw.on{animation:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="langs">
    <button class="pill" id="langUa" onclick="setLang('ua')">УКР</button>
    <button class="pill" id="langRu" onclick="setLang('ru')">РУС</button>
  </div>
  <div class="right">
    <div class="counter"><b id="cnt">0</b><span id="cntLbl">прочитано</span></div>
    <button class="eye" onclick="openPanel()" title="Для дорослих">👁</button>
  </div>
</div>

<div class="modes" id="modes"></div>
<div class="subbar" id="subbar"></div>
<div class="stage" id="stage"></div>
<div class="paws" id="paws"></div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closePanel()">
  <div class="panel">
    <h2 id="pTitle">Для дорослих</h2>
    <div id="pStats"></div>
    <div class="wordTable" id="pWords"></div>
    <div class="panelBtns">
      <button class="pbtn danger" onclick="resetProgress()" id="pReset">Скинути прогрес</button>
      <button class="pbtn" onclick="closePanel()" id="pClose">Закрити</button>
    </div>
  </div>
</div>

<script>
/* ════════ ДАННЫЕ: только частотное и знакомое ════════ */

const LANG = {
ua:{
  hardV:"АОУЕИІ", softV:"ЯЮЄ", allV:"АОУЕИІЇЄЮЯ",
  cons:"БВГДЖЗКЛМНПРСТФХЧШ", softC:"БВДЗЛМНПРСТ",
  famVowels:["А","О","У","И","І"],
  words:["КІТ","ДІМ","ЛІС","НІС","СІК","МАМА","ТАТО","РУКА","НОГА",
         "РИБА","ВОДА","МОРЕ","СУП","КАША","ЛАПА","СОН","ДЕНЬ","ОКО",
         "ВУХО","ЗУБ","МЕД","ЧАЙ","ПЕС","СОВА","КОЗА","ЗИМА","ЛІТО",
         "НЕБО","СІЛЬ","М'ЯЧ","СІМ'Я"],
  longWords:["СОБАКА","МАШИНА","МОЛОКО","КОРОВА","ЛОПАТА","ШКОЛА","КНИГА"],
  families:[["КІТ","КИТ","КУТ"],["МАК","РАК","ЛАК","БАК"],
      ["ЛУК","СУК","ЖУК"],["СОН","СОК","СОМ"],
      ["МАМА","РАМА","САМА"],["ГОРА","КОРА","НОРА","ПОРА"],
      ["ЛІС","НІС","РІС"],["СИР","МИР","ВИР"],["ДИМ","ДІМ"]],
  ui:{modes:["Склади","Слова","Сім'ї слів"],
      syllTypes:["Прямі","М'які","Обернені"],
      order:["Випадково","Сім'ями"],
      praise:["Молодець!","Супер!","Так!","Вірно!","Клас!","Чудово!"],
      tap:"Прочитай і торкнись 👆",
      counter:"прочитано", milestone:n=>`Вже ${n}! Ти молодець! 🎉`,
      parent:{title:"Для дорослих", today:"Карток сьогодні", session:"За цю сесію",
        best:"Найкраща сесія", streak:"Днів поспіль", avg:"Середній час на картку",
        auto:"Автоматизовано (25+ зустрічей)",
        slowLbl:"🔥 Повільні слова (частіше у тренуванні):",
        weakLbl:"Найменше зустрічей:",
        countLbl:"Знайомість слів:",
        reset:"Скинути прогрес", close:"Закрити", confirm:"Точно скинути весь прогрес?"}}
},
ru:{
  hardV:"АОУЭЫИ", softV:"ЯЮЁЕ", allV:"АОУЭЫИЕЁЮЯ",
  cons:"БВГДЖЗКЛМНПРСТФХЧШ", softC:"БВДЗЛМНПРСТ",
  famVowels:["А","О","У","Ы","И"],
  words:["КОТ","ДОМ","ЛЕС","НОС","СОК","МАМА","ПАПА","РУКА","НОГА",
         "РЫБА","ВОДА","МОРЕ","СУП","КАША","ЛАПА","СОН","ДЕНЬ","УХО",
         "ЗУБ","МЁД","ЧАЙ","ПЁС","СОВА","КОЗА","ЗИМА","ЛЕТО","НЕБО",
         "СОЛЬ","МЯЧ","СЕМЬЯ"],
  longWords:["СОБАКА","МАШИНА","МОЛОКО","КОРОВА","ЛОПАТА","ШКОЛА","КНИГА"],
  families:[["КОТ","РОТ","ПОТ"],["МАК","РАК","ЛАК","БАК"],
      ["ЛУК","СУК","ЖУК"],["СОН","СОК","СОМ","СОР"],
      ["МАМА","РАМА","САМА","ДАМА"],["ГОРА","КОРА","НОРА","ПОРА"],
      ["ДОМ","ТОМ","СОМ","КОМ","ЛОМ"],["ДЫМ","ДОМ","ДАМ"],["КИТ","КОТ","КУТ"]],
  ui:{modes:["Слоги","Слова","Семьи слов"],
      syllTypes:["Прямые","Мягкие","Обратные"],
      order:["Случайно","Семьями"],
      praise:["Молодец!","Супер!","Да!","Верно!","Класс!","Здорово!"],
      tap:"Прочитай и коснись 👆",
      counter:"прочитано", milestone:n=>`Уже ${n}! Ты молодец! 🎉`,
      parent:{title:"Для взрослых", today:"Карточек сегодня", session:"За эту сессию",
        best:"Лучшая сессия", streak:"Дней подряд", avg:"Среднее время на карточку",
        auto:"Автоматизировано (25+ встреч)",
        slowLbl:"🔥 Медленные слова (чаще в тренировке):",
        weakLbl:"Меньше всего встреч:",
        countLbl:"Знакомость слов:",
        reset:"Сбросить прогресс", close:"Закрыть", confirm:"Точно сбросить весь прогресс?"}}
}
};

/* ════════ ХРАНИЛИЩЕ ════════ */

const store = (()=>{
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];}}; }
})();
function sGet(k,d){ try{ const v=store.getItem("chit_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function sSet(k,v){ try{ store.setItem("chit_"+k, JSON.stringify(v)); }catch(e){} }

/* ════════ СОСТОЯНИЕ ════════ */

const today = new Date().toISOString().slice(0,10);
let S = {
  lang: sGet("lang","ua"),
  mode: sGet("mode",1),          // 0 слоги, 1 слова, 2 семьи — по умолчанию слова
  syllType: sGet("syllType",0),
  syllOrder: sGet("syllOrder",1), // по умолчанию семьями — так полезнее
  count:0, todayCount:0,
  recent:[],                      // последние показанные слова (защита от мгновенного повтора)
  recentFam:[],
  times:[], lastT:Date.now(),
  current:null, busy:false,
  famIdx:undefined, famPos:0,
};
let WSTATS = sGet("stats_"+S.lang, {});   // { СЛОВО: {n, slow, last} }

(function initDaily(){
  const d = sGet("daily",{date:today,count:0});
  S.todayCount = (d.date===today)? d.count : 0;
  const st = sGet("streak",{last:null,n:0});
  if (st.last!==today){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    st.n = (st.last===y)? st.n+1 : 1;
    st.last = today; sSet("streak",st);
  }
})();

/* ════════ ПЛАНИРОВЩИК: интервальное повторение ════════ */

function wstat(w){ return WSTATS[w] || {n:0, slow:0, last:0}; }

function weightOf(w, isLong){
  if (S.recent.includes(w)) return 0;            // не раньше чем через 3 карточки
  const s = wstat(w);
  let wt = 1/(1+s.n*0.25);                       // меньше встреч → выше вес
  if (s.n>=25) wt*=0.35;                         // автоматизировано → редко, но не исчезает
  if (s.slow>=2) wt*=3;                          // медленные → чаще
  if (s.last){
    const days=(Date.now()-s.last)/864e5;
    wt *= 1+Math.min(days,7)*0.25;               // давно не виделись → буст
  } else wt*=1.3;                                // совсем новые слегка приоритетнее
  if (isLong) wt*=0.3;                           // длинные ~5–10% потока
  return wt;
}

function pickWord(){
  const L=LANG[S.lang];
  const pool=[...L.words.map(w=>[w,false]), ...L.longWords.map(w=>[w,true])];
  const weights=pool.map(([w,lg])=>weightOf(w,lg));
  let total=weights.reduce((a,b)=>a+b,0);
  if (total<=0){ S.recent=[]; return pickWord(); }
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i][0]; }
  return pool[pool.length-1][0];
}

function pickFamily(){
  const fams=LANG[S.lang].families;
  const weights=fams.map((f,i)=>{
    if (S.recentFam.includes(i)) return 0;
    const avg=f.reduce((a,w)=>a+1/(1+wstat(w).n*0.25),0)/f.length;
    const slowBoost=f.some(w=>wstat(w).slow>=2)?2:1;
    return avg*slowBoost;
  });
  let total=weights.reduce((a,b)=>a+b,0);
  if (total<=0){ S.recentFam=[]; return pickFamily(); }
  let r=Math.random()*total;
  for(let i=0;i<fams.length;i++){ r-=weights[i]; if(r<=0) return i; }
  return fams.length-1;
}

function recordRead(w, dtMs){
  const s = wstat(w);
  s.n++; s.last=Date.now();
  const limit = 2000 + 900*String(w).replace(/['’Ь]/g,"").length;   // адаптивный порог по длине
  if (dtMs>limit) s.slow=Math.min(5,s.slow+1);
  else if (dtMs<limit*0.5 && s.slow>0) s.slow--;
  WSTATS[w]=s;
  sSet("stats_"+S.lang, WSTATS);
}

/* ════════ СЛОГИ (простые колоды, семьями или случайно) ════════ */

function isBadRu(s){ return ["ЖЫ","ШЫ","ЧЫ","ЩЫ","ЧЯ","ЩЯ","ЧЮ","ЩЮ","ЖЯ","ШЯ","ЖЮ","ШЮ"].includes(s); }
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildSyllDeck(){
  const L=LANG[S.lang], lg=S.lang, out=[];
  if (S.syllType===0){
    if (S.syllOrder===1){
      for(const c of shuffle([...L.cons]))
        for(const v of L.famVowels){const s=c+v; if(!(lg==="ru"&&isBadRu(s))) out.push(s);}
      return out;  // порядок семей сохранён
    }
    for(const c of L.cons) for(const v of L.hardV){const s=c+v; if(!(lg==="ru"&&isBadRu(s))) out.push(s);}
    return shuffle(out);
  }
  if (S.syllType===1){
    for(const c of L.softC) for(const v of L.softV){const s=c+v; if(!(lg==="ru"&&isBadRu(s))) out.push(s);}
    return shuffle(out);
  }
  for(const v of L.hardV) for(const c of L.cons) out.push(v+c);
  return shuffle(out);
}
let syllDeck=null, syllIdx=0;
function drawSyll(){
  if(!syllDeck || syllIdx>=syllDeck.length){
    let d=buildSyllDeck();
    if(d.length>1 && d[0]===S.current) [d[0],d[1]]=[d[1],d[0]];
    syllDeck=d; syllIdx=0;
  }
  return syllDeck[syllIdx++];
}

/* ════════ РЕНДЕР ════════ */

const $=id=>document.getElementById(id);
function colorize(w){
  const L=LANG[S.lang];
  return [...String(w)].map(ch=>{
    if(ch==="Ь"||ch==="'"||ch==="’") return `<span class="s">${ch}</span>`;
    if(L.allV.includes(ch)) return `<span class="v">${ch}</span>`;
    return `<span class="c">${ch}</span>`;
  }).join("");
}
function sizeClass(w){ const n=String(w).length; return n>6?"sz-small":n>4?"sz-mid":"sz-big"; }
function praiseWord(){ const p=LANG[S.lang].ui.praise; return p[Math.floor(Math.random()*p.length)]; }

function renderTop(){
  $("langUa").className="pill"+(S.lang==="ua"?" on":"");
  $("langRu").className="pill"+(S.lang==="ru"?" on":"");
  $("cnt").textContent=S.todayCount;
  $("cntLbl").textContent=LANG[S.lang].ui.counter;
  const ui=LANG[S.lang].ui;
  $("modes").innerHTML=ui.modes.map((m,i)=>
    `<button class="mode${i===S.mode?" on":""}" onclick="setMode(${i})">${m}</button>`).join("");
  let sub="";
  if(S.mode===0){
    sub=ui.syllTypes.map((t,i)=>`<button class="chip${i===S.syllType?" on":""}" onclick="setSyllType(${i})">${t}</button>`).join("");
    if(S.syllType===0)
      sub+=`<span style="width:8px"></span>`+ui.order.map((o,i)=>`<button class="chip${i===S.syllOrder?" on":""}" onclick="setSyllOrder(${i})">${o}</button>`).join("");
  }
  $("subbar").innerHTML=sub;
  renderPaws();
}
function renderPaws(){
  const n = S.todayCount===0?0:(S.todayCount%10===0?10:S.todayCount%10);
  $("paws").innerHTML=Array.from({length:10},(_,i)=>
    `<span class="paw${i<n?" on":""}">🐾</span>`).join("");
}

function renderCard(){
  const ui=LANG[S.lang].ui;
  let famHtml="";
  if (S.mode===2){
    const fam=LANG[S.lang].families[S.famIdx];
    famHtml=`<div class="famRow">`+fam.map((w,i)=>
      `<span class="famItem${i===S.famPos?" cur":i<S.famPos?" done":""}">${w}</span>`).join("")+`</div>`;
  }
  $("stage").innerHTML=`
    <button class="card appear" id="card" onclick="onRead()">
      <div class="word ${sizeClass(S.current)}">${colorize(S.current)}</div>
    </button>
    ${famHtml}
    <div class="hint">${ui.tap}</div>`;
  S.lastT=Date.now();
}

function showPraise(){
  const p=document.createElement("div");
  p.className="praise"; p.textContent=praiseWord();
  $("stage").appendChild(p);
  setTimeout(()=>p.remove(),700);
}
function showMilestone(){
  const m=document.createElement("div");
  m.className="milestone"; m.textContent=LANG[S.lang].ui.milestone(S.todayCount);
  $("stage").appendChild(m);
  setTimeout(()=>m.remove(),2600);
}

/* ════════ ЛОГИКА ════════ */

function bumpCount(){
  S.count++; S.todayCount++;
  sSet("daily",{date:today,count:S.todayCount});
  if(S.count>sGet("best",0)) sSet("best",S.count);
  $("cnt").textContent=S.todayCount;
  renderPaws();
}

function onRead(){
  if(S.busy) return;
  S.busy=true;
  const dt=Date.now()-S.lastT;
  if(dt<60000) S.times.push(dt/1000);
  // учёт знакомости — только для слов и семей
  if(S.mode!==0) recordRead(S.current, dt);
  // защита от мгновенного повтора
  if(S.mode!==0){
    S.recent.push(S.current);
    if(S.recent.length>3) S.recent.shift();
  }
  const card=$("card");
  card.classList.remove("appear"); card.classList.add("pop");
  showPraise();
  setTimeout(()=>{
    S.busy=false;
    bumpCount();
    if(S.todayCount%10===0) setTimeout(showMilestone,350);
    nextCard();
  },300);
}

function nextCard(){
  if(S.mode===0){ S.current=drawSyll(); renderCard(); return; }
  if(S.mode===2){
    const fams=LANG[S.lang].families;
    if(S.famIdx===undefined || S.famPos>=fams[S.famIdx].length-1){
      S.famIdx=pickFamily(); S.famPos=0;
      S.recentFam.push(S.famIdx);
      if(S.recentFam.length>2) S.recentFam.shift();
    } else S.famPos++;
    S.current=fams[S.famIdx][S.famPos];
    renderCard(); return;
  }
  S.current=pickWord();
  renderCard();
}

/* ════════ ПЕРЕКЛЮЧАТЕЛИ ════════ */

function fresh(){
  S.famIdx=undefined; S.famPos=0; S.busy=false;
  syllDeck=null; syllIdx=0;
  renderTop();
  nextCard();
}
function setLang(l){ if(l===S.lang)return; S.lang=l; sSet("lang",l);
  WSTATS=sGet("stats_"+l,{}); S.recent=[]; S.recentFam=[]; fresh(); }
function setMode(m){ if(m===S.mode)return; S.mode=m; sSet("mode",m); fresh(); }
function setSyllType(t){ if(t===S.syllType)return; S.syllType=t; sSet("syllType",t); fresh(); }
function setSyllOrder(o){ if(o===S.syllOrder)return; S.syllOrder=o; sSet("syllOrder",o); fresh(); }

/* ════════ ПАНЕЛЬ ДЛЯ ВЗРОСЛЫХ ════════ */

function openPanel(){
  const ui=LANG[S.lang].ui.parent, L=LANG[S.lang];
  const avg=S.times.length? (S.times.reduce((a,b)=>a+b,0)/S.times.length).toFixed(1)+" c" : "—";
  const st=sGet("streak",{n:1});
  const all=[...L.words,...L.longWords];
  const autoCount=all.filter(w=>wstat(w).n>=25).length;
  $("pTitle").textContent=ui.title;
  $("pReset").textContent=ui.reset;
  $("pClose").textContent=ui.close;
  $("pStats").innerHTML=`
    <div class="stat"><span>${ui.today}</span><b>${S.todayCount}</b></div>
    <div class="stat"><span>${ui.session}</span><b>${S.count}</b></div>
    <div class="stat"><span>${ui.best}</span><b>${sGet("best",0)}</b></div>
    <div class="stat"><span>${ui.streak}</span><b>${st.n}</b></div>
    <div class="stat"><span>${ui.avg}</span><b>${avg}</b></div>
    <div class="stat"><span>${ui.auto}</span><b>${autoCount} / ${all.length}</b></div>`;
  const slow=all.filter(w=>wstat(w).slow>=2).sort((a,b)=>wstat(b).slow-wstat(a).slow);
  const known=all.filter(w=>wstat(w).n>0).sort((a,b)=>wstat(b).n-wstat(a).n);
  const weak=all.filter(w=>wstat(w).n>0).sort((a,b)=>wstat(a).n-wstat(b).n).slice(0,8);
  let html="";
  if(slow.length) html+=`<div class="lbl">${ui.slowLbl}</div><span class="slow">`+
    slow.map(w=>`${w}`).join(" · ")+`</span>`;
  if(known.length){
    html+=`<div class="lbl">${ui.countLbl}</div>`+
      known.slice(0,10).map(w=>`${w} — ${wstat(w).n}`).join(" · ");
    if(weak.length) html+=`<div class="lbl">${ui.weakLbl}</div>`+
      weak.map(w=>`${w} — ${wstat(w).n}`).join(" · ");
  }
  $("pWords").innerHTML=html;
  $("overlay").classList.add("show");
}
function closePanel(){ $("overlay").classList.remove("show"); }
function resetProgress(){
  if(!confirm(LANG[S.lang].ui.parent.confirm)) return;
  ["daily","best","streak","stats_ua","stats_ru"].forEach(k=>store.removeItem("chit_"+k));
  S.todayCount=0; S.count=0; S.times=[]; WSTATS={}; S.recent=[]; S.recentFam=[];
  sSet("streak",{last:today,n:1});
  closePanel(); renderTop();
}

/* ════════ СТАРТ ════════ */
fresh();
</script>
