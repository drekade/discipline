<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал операцій</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F2EBDB;
    --purple: #5D3A8E;
    --orange: #FE702D;
    --dark: #1A1410;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--dark);
    padding-bottom: 40px;
  }
  header {
    padding: 18px 16px 14px;
    background: var(--dark);
    color: #fff;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
  }
  header .sub {
    font-size: 13px;
    opacity: 0.75;
    margin-top: 2px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px;
  }
  select, input {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #d9cbb0;
    border-radius: 8px;
    width: 100%;
    background: #fff;
    color: var(--dark);
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .filters > * { flex: 1; }
  .entry {
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(26,20,16,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .entry.negative {
    border-left: 4px solid #c0392b;
  }
  .entry-left {
    font-size: 13px;
  }
  .entry-left .student {
    font-weight: 700;
    font-size: 14px;
  }
  .entry-left .meta {
    color: #7a6f5f;
    margin-top: 2px;
  }
  .entry-right {
    text-align: right;
    white-space: nowrap;
  }
  .entry-right .amount {
    font-weight: 700;
    font-size: 15px;
  }
  .amount.positive { color: #2f7a3d; }
  .amount.negative { color: #c0392b; }
  .entry-right .time {
    font-size: 11px;
    color: #9a8f7c;
    margin-top: 2px;
  }
  .empty {
    text-align: center;
    color: #9a8f7c;
    padding: 40px 16px;
    font-size: 14px;
  }
  .stats {
    font-size: 13px;
    color: #7a6f5f;
    margin-bottom: 10px;
  }
  .config-warning {
    background: #fff3cd;
    border: 1px solid #ffe08a;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  code { background: #eee2c9; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Журнал операцій</h1>
  <div class="sub">повна історія всіх змін сум, найновіше зверху</div>
</header>

<div class="wrap">
  <div id="configWarning" style="display:none" class="config-warning">
    Не налаштовано підключення до бази. Відкрий файл і впиши SUPA_URL і SUPA_KEY
    на початку блоку <code>&lt;script&gt;</code> внизу сторінки.
  </div>

  <div class="filters">
    <select id="collectionFilter"><option value="">Усі збори</option></select>
    <input type="text" id="studentFilter" placeholder="Прізвище">
  </div>

  <div class="stats" id="statsLine"></div>
  <div id="entriesList"></div>
</div>

<script>
// ====== НАСТРОЙКА ======
const SUPA_URL = "https://cgicdlrrpjwfvvkxkglx.supabase.co";
const SUPA_KEY = "sb_publishable_GRan1uWwXXbFp27tOXvV4w_HHO57fkf";
// ========================

let sb = null;
if (SUPA_URL.indexOf("YOUR_") === -1 && SUPA_KEY.indexOf("YOUR_") === -1) {
  sb = supabase.createClient(SUPA_URL, SUPA_KEY);
} else {
  document.getElementById("configWarning").style.display = "block";
}

let students = [];
let collections = [];
let logs = [];

function fmtMoney(n) {
  n = Number(n) || 0;
  return n.toLocaleString("uk-UA");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("uk-UA") + " " + d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
}

async function loadAll() {
  if (!sb) return;
  const { data: st } = await sb.from("students").select("*").order("name");
  students = st || [];

  const { data: cols } = await sb.from("collections").select("*").order("created_at", { ascending: false });
  collections = cols || [];

  const { data: lg } = await sb.from("payment_log").select("*").order("created_at", { ascending: false });
  logs = lg || [];

  populateCollectionFilter();
  render();
}

function populateCollectionFilter() {
  const sel = document.getElementById("collectionFilter");
  const current = sel.value;
  sel.innerHTML = '<option value="">Усі збори</option>' + collections.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("");
  sel.value = current;
}

function render() {
  const studentQuery = document.getElementById("studentFilter").value.trim().toLowerCase();
  const collectionId = document.getElementById("collectionFilter").value;

  const studentMap = {};
  students.forEach(s => studentMap[s.id] = s.name);
  const collectionMap = {};
  collections.forEach(c => collectionMap[c.id] = c);

  let filtered = logs;
  if (collectionId) filtered = filtered.filter(l => l.collection_id === collectionId);
  if (studentQuery) filtered = filtered.filter(l => (studentMap[l.student_id] || "").toLowerCase().includes(studentQuery));

  const listEl = document.getElementById("entriesList");
  const statsEl = document.getElementById("statsLine");

  const totalPositive = filtered.filter(l => Number(l.amount) > 0).reduce((a, l) => a + Number(l.amount), 0);
  const totalNegative = filtered.filter(l => Number(l.amount) < 0).reduce((a, l) => a + Number(l.amount), 0);
  const negCount = filtered.filter(l => Number(l.amount) < 0).length;

  statsEl.textContent = filtered.length
    ? `${filtered.length} операцій · надійшло ${fmtMoney(totalPositive)} грн · відкатів ${fmtMoney(Math.abs(totalNegative))} грн (${negCount})`
    : "";

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">Записів не знайдено</div>';
    return;
  }

  listEl.innerHTML = filtered.map(l => {
    const c = collectionMap[l.collection_id];
    const studentName = studentMap[l.student_id] || "видалений учень";
    const amount = Number(l.amount);
    const isNeg = amount < 0;
    const methodLabel = l.method === "cash" ? "готівка" : "картка";
    return `
      <div class="entry ${isNeg ? "negative" : ""}">
        <div class="entry-left">
          <div class="student">${escapeHtml(studentName)}</div>
          <div class="meta">${c ? escapeHtml(c.title) : "видалений збір"} &middot; ${methodLabel}</div>
        </div>
        <div class="entry-right">
          <div class="amount ${isNeg ? "negative" : "positive"}">${isNeg ? "" : "+"}${fmtMoney(amount)} грн</div>
          <div class="time">${fmtDateTime(l.created_at)}</div>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("collectionFilter").addEventListener("change", render);
document.getElementById("studentFilter").addEventListener("input", render);

if (sb) {
  loadAll();
  setInterval(() => {
    if (document.activeElement && document.activeElement.id === "studentFilter") return;
    loadAll();
  }, 10000);
}
</script>
</body>
</html>
